name: Release

# Push a tag like v0.2.0 (matching apps/cli/package.json) to build the
# standalone executables from this exact source, attest their provenance,
# and publish them as a GitHub release with checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the build attestation
  attestations: write

jobs:
  release:
    # Apple Silicon runner: builds every target and ad-hoc signs the macOS ones
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Tag matches the package version
        run: |
          v="v$(bun -e 'console.log(require("./apps/cli/package.json").version)')"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package version $v"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages
      - run: bun run build
      - name: Build standalone executables
        run: bun run --cwd apps/cli compile --all

      - name: Smoke-test the macOS build
        run: |
          ./apps/cli/dist-bin/abstract-darwin-arm64/abstract --version
          ./apps/cli/dist-bin/abstract-darwin-arm64/abstract --help

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/cli/dist-bin/*.tar.gz

      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          macOS and Linux, nothing else needed:

          ```bash
          curl -fsSL https://useabstract.co/install.sh | sh
          ```

          Or download a file below and check it against `SHA256SUMS`. Each file was built by this
          workflow from the tagged source; verify that with
          `gh attestation verify <file> --repo rabieHs/abstract`.

          Full guide: https://useabstract.co/docs/install/
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/cli/dist-bin/*.tar.gz apps/cli/dist-bin/SHA256SUMS \
            --title "abstract $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
